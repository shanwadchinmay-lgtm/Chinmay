<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first webpage</title>
    <link rel="stylesheet" href="CSS.css">
</head>
<body>
    <h1>Welcome to my first webpage!</h1>
    <p>This is a simple HTML page created as an example.</p>
    <img width="100" src="image.png" alt="Google Logo" >
    <br>
    <a href="https://www.google.com" target="_blank">Visit Google</a>
    <table border="1">
        <tr>
            <th>Header 1</th>
            <th>Header 2</th>
            <th>Header 3</th>
        </tr>
        <tr>
            <td colspan="2">colspan</td>
            <td>Row 1, Cell 2</td>
        </tr>
        <tr>
            <td rowspan="2">Row span</td>
            <td>Row 2, Cell 2</td>
            <td>Row 2, Cell 3</td>
        </tr>
        <tr>
            <td>Row 3, Cell 2</td>
            <td>Row 3, Cell 3</td>
        </tr>
    </table>
</body>
</html>
